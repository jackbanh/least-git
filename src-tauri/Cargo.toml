[package]
name = "least-git"
version = "0.3.0"
description = "least-git — a minimal Git GUI for large monorepos"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "least_git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
gix = { version = "0.70", features = ["revision"] }
notify-debouncer-mini = "0.7"
dashmap = "6"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.8.0"
log = "0.4.29"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Better format strings: format!("{x}") instead of format!("{}", x)
uninlined_format_args = "warn"
# Avoid wrapping method refs in pointless closures: Result::ok instead of |r| r.ok()
redundant_closure_for_method_calls = "warn"
# Use Display (path.display()) instead of Debug ({path:?}) in log output
unnecessary_debug_formatting = "warn"
